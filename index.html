<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rukkilill</title>
<meta name="description" content="Эстонский до B2: карточки, перевод предложений и словарь">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e121b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rukkilill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky top bar, fixed bottom tab bar; rukkilill (cornflower) accent on cold Baltic neutrals */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#e7ebf3; --fg:#141a26; --muted:#5b6578; --line:#d5dbe6;
  --accent:#3d5bd9; --accent-fg:#ffffff; --accent-soft:#e3e8fc;
  --good:#1f8a5b; --good-soft:#ddf3e8; --warn:#b46a0c; --warn-soft:#fbeedb; --bad:#c23a3a; --bad-soft:#f9e1e1;
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,26,38,.06),0 6px 20px rgba(20,26,38,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e121b; --surface:#171d2a; --sunk:#1f2737; --fg:#e8ecf4; --muted:#98a2b6; --line:#2a3346;
  --accent:#8ea2ff; --accent-fg:#0e121b; --accent-soft:#232d4d;
  --good:#5fd19c; --good-soft:#163428; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a8a; --bad-soft:#3d1c1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121b; --surface:#171d2a; --sunk:#1f2737; --fg:#e8ecf4; --muted:#98a2b6; --line:#2a3346;
  --accent:#8ea2ff; --accent-fg:#0e121b; --accent-soft:#232d4d;
  --good:#5fd19c; --good-soft:#163428; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a8a; --bad-soft:#3d1c1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.stat b{color:var(--fg);font-weight:600}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:16px;padding-block:4px 16px}
h2{font-family:var(--f-display);font-size:20px;font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}

/* flashcard */
.card-stage{perspective:1200px}
.fcard{position:relative;width:100%;min-height:300px;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);display:block;text-align:left}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:12px}
.face.back{transform:rotateY(180deg)}
.face .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.box{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.word{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,8vw,38px);line-height:1.15;margin:auto 0;word-break:break-word;letter-spacing:-.015em}
.hint{font-size:13px;color:var(--muted);text-align:center}
.forms{font-size:14px;color:var(--muted)}
.forms b{color:var(--fg);font-weight:600}
.ex{border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.ex .ru{color:var(--muted);font-size:14px}
.trans{font-size:24px;font-weight:600;line-height:1.25}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.btn{text-decoration:none}
.btn{border:0;border-radius:var(--r);padding:14px 16px;font-weight:600;font-size:16px;background:var(--sunk);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:10px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.done{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.done .big{font-family:var(--f-display);font-size:42px;color:var(--accent)}

/* progress */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ladder div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.ladder b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.ladder span{font-size:11px;color:var(--muted)}

/* sentences */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.prompt{font-size:21px;font-weight:600;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--sunk);border-radius:6px;padding:3px 8px;color:var(--muted)}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:17px;line-height:1.4}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px 13px 42px;font-size:17px}
.verdict{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.verdict.correct{background:var(--good-soft)}
.verdict.almost{background:var(--warn-soft)}
.verdict.wrong{background:var(--bad-soft)}
.verdict .head{font-weight:700;display:flex;gap:8px;align-items:center}
.verdict.correct .head{color:var(--good)} .verdict.almost .head{color:var(--warn)} .verdict.wrong .head{color:var(--bad)}
.verdict .ref{font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.thinking{color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}.dot{animation:none}}
.note{font-size:13px;color:var(--muted)}

/* dictionary */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .et{font-weight:600}
.item .ru{color:var(--muted);font-size:14px}
.item > div{min-width:0}
.entry h3{font-family:var(--f-display);font-weight:500;font-size:26px;margin:0;word-break:break-word}
.entry .pos{font-size:13px;color:var(--muted)}
.formsgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.formsgrid dt{color:var(--muted)} .formsgrid dd{margin:0;font-weight:600}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
select{font:inherit;color:inherit;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px}
input[type=password],input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.field{display:flex;flex-direction:column;gap:6px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
a{color:var(--accent)}
.ok{color:var(--good);font-weight:600}.err{color:var(--bad);font-weight:600}
.who{display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
.thread{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.35;text-align:left;border:0;word-break:break-word}
.bubble.them{align-self:flex-start;background:var(--sunk);color:var(--fg);border-bottom-left-radius:6px}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:6px}
.bubble .tr{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.bubble.typing{display:flex;gap:5px;padding:14px}
.thread .verdict{align-self:flex-end;max-width:92%;padding:10px 12px;font-size:14px}
.samples{display:flex;flex-direction:column;gap:8px}
.samples div{background:var(--sunk);border-radius:12px;padding:10px 12px}
.samples .ru{color:var(--muted);font-size:14px}
.levels{display:flex;flex-direction:column;gap:8px}
.level-btn{flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.check{display:flex;gap:10px;align-items:center;font-size:16px}
.check input{width:20px;height:20px}
.back-btn{align-self:flex-start}
.item.menu{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--fg)}
.item.menu:first-child{border-top:0}
.item .val{text-align:right;font-size:14px;max-width:55%}
.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.letter{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.letter .l{font-family:var(--f-display);font-size:18px}
.letter .w{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.letter.special{background:var(--accent-soft)}
.letter.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.big-letter{font-family:var(--f-display);font-size:40px;color:var(--accent)}
.letter-detail{min-height:132px}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center}
.pair.wide{grid-template-columns:auto 1fr}
.pair .dg{font-family:var(--f-display);font-size:18px;color:var(--accent);min-width:28px}
.pair:has(.dg){grid-template-columns:auto auto 1fr}
.say{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;text-align:left}
@media (max-width:380px){.pair{grid-template-columns:auto 1fr}}
</style>
</head>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><g fill="var(--accent)"><circle cx="13" cy="13" r="3.2"/><path d="M13 1.5l2 6.2h-4zM13 24.5l-2-6.2h4zM1.5 13l6.2-2v4zM24.5 13l-6.2 2v-4zM4.9 4.9l5.8 3-2.8 2.8zM21.1 21.1l-5.8-3 2.8-2.8zM21.1 4.9l-3 5.8-2.8-2.8zM4.9 21.1l3-5.8 2.8 2.8z"/></g></svg>
    Rukkilill

</div></header>

<main>

  <section class="wrap" id="v-chat" hidden></section>
  <section class="wrap" id="v-dict" hidden></section>

</main>

<nav class="tabs" aria-label="Разделы"><div class="in">

  <button data-tab="sent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Перевод</button>
  <button data-tab="chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>Чат</button>
  <button data-tab="dict"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-4a2 2 0 0 0-2 2"/><path d="M20 4v14h-6"/></svg>Словарь</button>
  <button data-tab="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Ещё</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

// ---------- State ----------
const INTERVALS = [0, 1, 3, 7, 16, 35]; // days per box (0 = new)
const BOX_NAMES = ["новые","учу","1 день","3 дня","неделя+"];
let S = {progress:{}, custom:[], log:{}, dir:"et", sdir:"ru2et", topic:"all", tab:"cards", apiKey:"", model:"claude-opus-5-5", dictCache:{}, level:"B2", lang:"ru", slow:false, more:""};
const DAY = 86400000;
const today = () => new Date().toISOString().slice(0,10);
try{ const raw = localStorage.getItem("rukkilill"); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}

function persist(){
  try{ localStorage.setItem("rukkilill", JSON.stringify(S)); }catch(e){}
}
try{ navigator.storage?.persist?.(); }catch(e){}

// Level and translation language. `ru` on word/sentence objects is the translation in the chosen language.
const RANK = {A1:0, A2:1, B1:2, B2:3, C1:4};
const LEVELS = [
  {id:"A2", name:"Начинающий", note:"A1–A2: первые слова, числа, простые фразы"},
  {id:"B1", name:"Средний", note:"до B1: быт, работа, город, здоровье"},
  {id:"B2", name:"Продвинутый", note:"до B2: всё, включая общество и связки"}
];
const fitsLevel = lvl => (RANK[lvl] ?? 3) <= RANK[S.level||"B2"];
const LANGS = {
  ru:{code:"RU", gen:"русского", acc:"русский", prep:"русском", name:"Русский"},
  en:{code:"EN", gen:"английского", acc:"английский", prep:"английском", name:"English"}
};
const L = () => LANGS[S.lang] || LANGS.ru;
const isEn = () => S.lang==="en";
function everyWord(){
  const out = [];
  for(const t of TOPICS) for(const w of t.words) out.push({et:w[0], ru:isEn()?w[4]:w[1], ruText:w[1], enText:w[4], lvl:w[2], forms:w[3], topic:t.id});
  for(const c of S.custom) out.push(Object.assign({topic:"mine"}, c, {ru:(isEn()?(c.en||c.ru):(c.ru||c.en)), ruText:c.ru, enText:c.en}));
  return out;
}
function allWords(){ return everyWord().filter(w=>w.topic==="mine" || fitsLevel(w.lvl)); }
const byEt = () => Object.fromEntries(everyWord().map(w=>[w.et,w]));
const sentTr = s => isEn() ? s[4] : s[1];
function exampleFor(et){ return SENTENCES.find(s=>s[3].includes(et) && fitsLevel(s[2])) || SENTENCES.find(s=>s[3].includes(et)); }
function boxOf(et){ return S.progress[et]?.box ?? 0; }
function isDue(et){ const p = S.progress[et]; return !p || p.due <= Date.now(); }
function learnedCount(){ return allWords().filter(w=>(S.progress[w.et]?.box||0)>=2).length; }
function seenWords(){ return new Set(Object.keys(S.progress)); }

// ---------- Helpers ----------
const $ = (s,el=document)=>el.querySelector(s);
const h = (html)=>{ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(t._t); t._t=setTimeout(()=>t.hidden=true,2200); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const SPEAK_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
// Pronunciation: Neurokõne, the University of Tartu's Estonian speech synthesis (free, CORS-enabled).
// Audio is kept in Cache Storage so words heard once play offline; the device voice is the fallback.
const TTS_URL = "https://api.tartunlp.ai/text-to-speech/v2";
const TTS_VOICE = "mari";
const AUDIO_CACHE = "rukkilill-audio";
let actx = null, playing = null, speakSeq = 0;
function audioCtx(){
  const C = window.AudioContext || window.webkitAudioContext;
  if(!actx && C) actx = new C();
  if(actx && actx.state === "suspended") actx.resume().catch(()=>{});
  return actx;
}
async function ttsAudio(text){
  const speed = S.slow ? 0.75 : 1;
  const key = `${TTS_URL}?speaker=${TTS_VOICE}&speed=${speed}&text=${encodeURIComponent(text)}`;
  let cache = null;
  try{ cache = await caches.open(AUDIO_CACHE); const hit = await cache.match(key); if(hit) return await hit.arrayBuffer(); }catch(e){}
  const res = await fetch(TTS_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text, speaker:TTS_VOICE, speed})});
  if(!res.ok) throw new Error("tts " + res.status);
  const buf = await res.arrayBuffer();
  try{ await cache?.put(key, new Response(buf.slice(0), {headers:{"Content-Type":"audio/wav"}})); }catch(e){}
  return buf;
}
let etVoice = null;
function pickVoice(){ try{ etVoice = speechSynthesis.getVoices().find(v=>/^et/i.test(v.lang)) || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function deviceSpeak(text){
  try{ const u = new SpeechSynthesisUtterance(text); u.lang="et-EE"; if(etVoice) u.voice=etVoice; u.rate = S.slow ? .7 : .9; speechSynthesis.speak(u); }catch(e){}
}
// Call from a tap: the audio context must be unlocked inside the gesture (iPhone).
async function speak(text){
  const ctx = audioCtx();
  const seq = ++speakSeq;
  try{ playing?.stop(); }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  const slowNote = setTimeout(()=>{ if(seq===speakSeq) toast("Загружаю озвучку…"); }, 700);
  try{
    if(!ctx) throw new Error("no audio");
    const buf = await ttsAudio(text);
    const audio = await ctx.decodeAudioData(buf);
    clearTimeout(slowNote);
    if(seq !== speakSeq) return;
    const src = ctx.createBufferSource(); src.buffer = audio; src.connect(ctx.destination); src.start(); playing = src;
    $("#toast").hidden = true;
  }catch(e){
    clearTimeout(slowNote);
    if(seq !== speakSeq) return;
    if(etVoice) deviceSpeak(text);
    else toast(navigator.onLine===false ? "Для новой озвучки нужен интернет. Уже прослушанные слова работают без него." : "Не получилось загрузить озвучку. Попробуйте ещё раз.");
  }
}
function normalize(s){ return s.toLowerCase().replace(/[.,!?;:«»"'—–-]/g," ").replace(/ё/g,"е").replace(/\s+/g," ").trim(); }

function updateStat(){
  const n = learnedCount(), total = allWords().length;
  $("#stat").innerHTML = `Выучено <b>${n}</b> из ${total}<br>Сегодня карточек: <b>${S.log[today()]||0}</b>`;
}

// ---------- Claude (dictionary + grading) ----------
const MODELS = [
  {id:"claude-opus-5-5", name:"Claude Opus 5.5", note:"точнее объясняет ошибки"},
  {id:"claude-haiku-5-5", name:"Claude Haiku 5.5", note:"быстрее и намного дешевле"}
];
let sample = null;
function setupClaude(){
  if(!S.apiKey){ sample = null; return; }
  const client = new Anthropic({apiKey:S.apiKey, dangerouslyAllowBrowser:true, maxRetries:1});
  sample = {
    // One structured-output request; returns the parsed JSON object.
    async json(prompt, {schema, signal, maxTokens=4000} = {}){
      const params = {
        model:S.model, max_tokens:maxTokens,
        output_config:{effort:"low", format:{type:"json_schema", schema}},
        messages:[{role:"user", content:prompt}]
      };
      const res = S.model==="claude-opus-5-5"
        ? await client.beta.messages.create({...params, betas:["server-side-fallback-2026-07-01"], fallbacks:"default"}, {signal})
        : await client.messages.create(params, {signal});
      if(res.stop_reason==="refusal") throw {code:"refused"};
      if(res.stop_reason==="max_tokens") throw {code:"truncated"};
      const text = res.content.filter(b=>b.type==="text").map(b=>b.text).join("");
      return JSON.parse(text);
    }
  };
}
setupClaude();
const obj = (properties) => ({type:"object", properties, required:Object.keys(properties), additionalProperties:false});
const STR = {type:"string"};
const SCHEMA_GRADE = obj({verdict:{type:"string", enum:["correct","almost","wrong"]}, score:{type:"integer"}, feedback:STR, corrected:STR});
const SCHEMA_GEN = obj({et:STR, ru:STR, words:{type:"array", items:STR}});
const SCHEMA_CHAT = obj({verdict:{type:"string", enum:["correct","almost","wrong"]}, feedback:STR, corrected:STR, reply_et:STR, reply_ru:STR, done:{type:"boolean"}});
const SCHEMA_DICT = obj({et:STR, ru:STR, pos:STR, level:STR, forms:{type:"array", items:obj({label:STR, value:STR})}, examples:{type:"array", items:obj({et:STR, ru:STR})}, note:STR});
function sampleErr(e){
  if(e instanceof Anthropic.APIUserAbortError || e?.name==="AbortError") return "";
  if(e instanceof Anthropic.AuthenticationError) return "Ключ API не подошёл. Проверьте его в настройках.";
  if(e instanceof Anthropic.PermissionDeniedError) return "У этого ключа нет доступа к выбранной модели. Выберите другую в настройках.";
  if(e instanceof Anthropic.RateLimitError) return "Слишком много запросов. Попробуйте через минуту.";
  if(e instanceof Anthropic.BadRequestError && /credit|balance|billing/i.test(e.message)) return "На счёте API закончились деньги. Пополните баланс в консоли Anthropic.";
  if(e instanceof Anthropic.APIConnectionError) return "Нет интернета. Карточки и встроенный словарь работают и без него.";
  if(e instanceof Anthropic.InternalServerError) return "Сервис Claude сейчас перегружен. Попробуйте ещё раз чуть позже.";
  if(e?.code==="refused") return "Claude не стал отвечать на этот запрос. Попробуйте переформулировать.";
  if(e?.code==="truncated" || e instanceof SyntaxError) return "Ответ пришёл не полностью. Попробуйте ещё раз.";
  return "Не получилось получить ответ. Попробуйте ещё раз.";
}
// Without an API key, questions go to the Claude app/site as a prefilled chat (uses the person's subscription).
const claudeUrl = prompt => "https://claude.ai/new?q=" + encodeURIComponent(prompt);
const CLAUDE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
function claudeLink(label, prompt, cls="primary"){

const dictPrompt = q => `Ты эстонско-${isEn()?"английский":"русский"} словарь. Я учу эстонский до уровня ${S.level}, объясняй по-русски. Слово или фраза: «${q}».
Дай: начальную форму на эстонском, перевод на ${L().acc}, часть речи, основные формы (для существительных: omastav, osastav, мн. ч. osastav; для глаголов: ma-инфинитив, da-инфинитив, наст. вр. «ma», прош. вр. «ma»), 2 коротких примера с переводом. Коротко, без лишнего текста.`;
function connectHint(text){
  return h(`<p class="note">${esc(text)}</p>`);
}

// ---------- Tabs ----------
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; persist(); render(); window.scrollTo(0,0); });
function render(){
  if(S.tab==="settings"){ S.tab="more"; S.more="settings"; }
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.tab===S.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  for(const id of ["cards","sent","chat","dict","more"]) $("#v-"+id).hidden = S.tab!==id;
  updateStat();
  if(S.tab==="cards") renderCards();
  if(S.tab==="sent") renderSent();

  if(S.tab==="dict") renderDict();

// ---------- Cards ----------
let queue = [], cur = null, flipped = false;
function levelRange(){ return {A2:"A1–A2", B1:"A2–B1", B2:"B1–B2"}[S.level] || "B1–B2"; }
function setLevel(id){ S.level = id; S.levelChosen = true; if(S.topic!=="all" && !allWords().some(w=>w.topic===S.topic)) S.topic="all"; queue=[]; cur=null; sentCur=null; chat=null; persist(); render(); }
function levelPicker(){
  const p = h(`<div class="panel"><div class="label">С чего начнём?</div><div>Выберите уровень. Его можно поменять в любой момент в разделе «Ещё».</div><div class="levels"></div></div>`);
  for(const l of LEVELS){
    const b = h(`<button class="btn ghost level-btn"><b>${esc(l.name)}</b><span class="note">${esc(l.note)}</span></button>`);
    b.onclick = ()=>setLevel(l.id);
    $(".levels",p).append(b);
  }
  return p;
}
function deckWords(){
  const all = allWords();
  return S.topic==="all" ? all : all.filter(w=>w.topic===S.topic);
}
function buildQueue(){
  const due = deckWords().filter(w=>isDue(w.et));
  const reviews = shuffle(due.filter(w=>S.progress[w.et]));
  const fresh = due.filter(w=>!S.progress[w.et]).slice(0, 10);
  queue = [...reviews, ...fresh].slice(0, 20);
}
function renderCards(){
  const v = $("#v-cards"); v.innerHTML = "";
  const topics = [{id:"all",name:"Все"}, ...TOPICS, ...(S.custom.length?[{id:"mine",name:"Мои слова"}]:[])];
  const all = allWords();
  if(!S.levelChosen) v.append(levelPicker());
  v.append(h(`<div><h2>Карточки</h2><p class="sub">Уровень: ${esc((LEVELS.find(l=>l.id===S.level)?.name||"").toLowerCase())}. Вспомнили слово — оно вернётся через несколько дней. Не вспомнили — повторим его ещё раз сегодня.</p></div>`));
  const chips = h(`<div class="chips" role="group" aria-label="Тема"></div>`);
  for(const t of topics){
    const ws = t.id==="all"?all:all.filter(w=>w.topic===t.id);
    if(!ws.length) continue;
    const due = ws.filter(w=>isDue(w.et)).length;
    const c = h(`<button class="chip" aria-pressed="${S.topic===t.id}">${esc(t.name)} <small>${due}</small></button>`);
    c.onclick=()=>{ S.topic=t.id; persist(); queue=[]; cur=null; renderCards(); };
    chips.append(c);
  }
  v.append(chips);
  const seg = h(`<div class="seg" role="group" aria-label="Сторона карточки"><button aria-pressed="${S.dir==="et"}">ET → ${L().code}</button><button aria-pressed="${S.dir==="ru"}">${L().code} → ET</button></div>`);
  seg.children[0].onclick=()=>{S.dir="et";persist();renderCards();};
  seg.children[1].onclick=()=>{S.dir="ru";persist();renderCards();};
  v.append(seg);

  if(!cur){ if(!queue.length) buildQueue(); cur = queue.shift() || null; flipped=false; }
  if(!cur){
    const n = deckWords().length;
    const next = deckWords().map(w=>S.progress[w.et]?.due).filter(Boolean).sort((a,b)=>a-b)[0];
    const when = next ? new Date(next).toLocaleDateString("ru-RU",{day:"numeric",month:"long"}) : "";
    const d = h(`<div class="done"><div class="big">Hästi tehtud!</div><div>В этой теме на сегодня всё (${n} слов).${when?` Следующее повторение — ${esc(when)}.`:""}</div><div class="sub">Переходите к предложениям, чтобы закрепить слова.</div></div>`);
    const b = h(`<button class="btn primary">Перейти к предложениям</button>`); b.onclick=()=>{S.tab="sent";render();};
    d.append(b); v.append(d);
  } else {
    const w = cur, ex = exampleFor(w.et);
    const front = S.dir==="et" ? `<div class="word" lang="et">${esc(w.et)}</div>` : `<div class="word">${esc(w.ru)}</div>`;
    const back = S.dir==="et"
      ? `<div class="trans">${esc(w.ru)}</div><div class="word" lang="et" style="font-size:20px;margin:0;color:var(--muted)">${esc(w.et)}</div>`
      : `<div class="trans" lang="et">${esc(w.et)}</div><div class="forms">${esc(w.ru)}</div>`;
    const forms = w.forms ? `<div class="forms">Формы: <b lang="et">${esc(w.forms)}</b></div>` : "";
    const exHtml = ex ? `<div class="ex"><div lang="et">${esc(ex[0])}</div><div class="ru">${esc(sentTr(ex))}</div></div>` : (w.example ? `<div class="ex"><div lang="et">${esc(w.example)}</div></div>`:"");
    const meta = `<div class="meta"><span class="lvl">${esc(w.lvl||"B2")}</span><span class="box">${BOX_NAMES[Math.min(boxOf(w.et),4)]} · осталось ${queue.length+1}</span></div>`;
    const stage = h(`<div class="card-stage"><button class="fcard ${flipped?"flipped":""}" aria-label="Перевернуть карточку">
      <div class="face front">${meta}${front}<div class="hint">Нажмите, чтобы перевернуть</div></div>
      <div class="face back">${meta}${back}${forms}${exHtml}</div></button></div>`);
    const fc = $(".fcard", stage);
    fc.onclick=()=>{ flipped=!flipped; fc.classList.toggle("flipped", flipped); acts.hidden=!flipped; };
    v.append(stage);
    const tools = h(`<div class="spread"><button class="btn sm ghost">${SPEAK_ICON} Произнести</button><span class="note">Формы: родительный · частичный / da-инф. · я-форма</span></div>`);
    tools.children[0].onclick=()=>speak(w.et);
    v.append(tools);
    const acts = h(`<div class="actions"><button class="btn bad">Не помню</button><button class="btn good">Помню</button></div>`);
    acts.hidden = !flipped;
    acts.children[0].onclick=()=>grade(false);
    acts.children[1].onclick=()=>grade(true);
    v.append(acts);
  }
  // ladder
  const counts=[0,0,0,0,0]; for(const w of all) counts[Math.min(boxOf(w.et),4)]++;
  const lad = h(`<div><div class="label" style="margin-bottom:8px">Прогресс по всем словам</div><div class="ladder">${counts.map((c,i)=>`<div><b>${c}</b><span>${BOX_NAMES[i]}</span></div>`).join("")}</div></div>`);
  v.append(lad);
}
function grade(ok){
  const p = S.progress[cur.et] || {box:0};
  const box = ok ? Math.min((p.box||0)+1, 5) : 1;
  S.progress[cur.et] = {box, due: Date.now() + (ok ? INTERVALS[box]*DAY : 60*1000), t: Date.now()};
  S.log[today()] = (S.log[today()]||0)+1;
  if(!ok) queue.splice(Math.min(3,queue.length),0,cur); // see it again soon
  persist(); cur=null; flipped=false; renderCards(); updateStat();
}

// ---------- Sentences ----------
let sentCur = null, sentAnswer = "", sentResult = null, sentBusy = false, sentCtl = null;
function pickSentence(){
  const seen = seenWords();
  const levelled = SENTENCES.filter(s=>fitsLevel(s[2]));
  let pool = levelled.filter(s=>s[3].some(w=>seen.has(w)));
  if(pool.length < 3) pool = levelled;
  // prefer sentences where most words are already studied
  pool = pool.map(s=>({s, score:s[3].filter(w=>seen.has(w)).length/s[3].length + Math.random()*.6}))
    .sort((a,b)=>b.score-a.score).slice(0,12).map(x=>x.s);
  let s = pool[Math.floor(Math.random()*pool.length)];
  if(sentCur && s===sentCur.raw && pool.length>1) s = pool.find(x=>x!==s);
  sentCur = {et:s[0], ru:sentTr(s), lvl:s[2], words:s[3], raw:s};
  sentAnswer = ""; sentResult = null;
}
function renderSent(){
  const v = $("#v-sent"); v.innerHTML = "";
  if(!sentCur) pickSentence();
  const seen = seenWords();

  seg.children[0].onclick=()=>{S.sdir="ru2et";sentResult=null;sentAnswer="";persist();renderSent();};
  seg.children[1].onclick=()=>{S.sdir="et2ru";sentResult=null;sentAnswer="";persist();renderSent();};
  v.append(seg);

  const toEt = S.sdir==="ru2et";

  const wordsMap = byEt();

    <div class="prompt" ${toEt?"":'lang="et"'}>${esc(src)}</div>
    <div class="tags">${sentCur.words.map(w=>`<span class="tag" lang="et">${esc(w)}${wordsMap[w]?" — "+esc(wordsMap[w].ru):""}</span>`).join("")}</div>
    <label class="label" for="answer">${toEt?"Ваш перевод на эстонский":"Ваш перевод на "+L().acc}</label>
    <textarea id="answer" ${toEt?'lang="et" autocapitalize="sentences"':""} placeholder="${toEt?"Kirjuta siia…":"Напишите здесь…"}"></textarea>
    <div class="row" id="sent-act"></div>
    <div id="sent-res"></div>

    const words = shuffle([...seenWords()]).slice(0,8);

  }
}
function drawSentResult(panel){
  const box = $("#sent-res", panel); box.innerHTML="";
  const r = sentResult; if(!r) return;
  const toEt = S.sdir==="ru2et";
  const ref = toEt ? sentCur.et : sentCur.ru;
  if(r.busy){ box.append(h(`<div class="thinking"><span class="dot"></span>Claude проверяет перевод…</div>`)); return; }
  if(r.verdict==="shown"){
    box.append(h(`<div class="verdict almost"><div class="head">Правильный ответ</div><div class="ref" ${toEt?'lang="et"':""}>${esc(ref)}</div></div>`)); return;
  }
  const titles = {correct:"Верно!", almost:"Почти", wrong:"Есть ошибки"};
  const el = h(`<div class="verdict ${r.verdict}"><div class="head">${titles[r.verdict]||"Результат"}${r.score!=null?` · ${r.score}/100`:""}</div></div>`);
  if(r.feedback) el.append(h(`<div>${esc(r.feedback)}</div>`));
  if(r.corrected && normalize(r.corrected)!==normalize(sentAnswer)) el.append(h(`<div><span class="label">Исправленный вариант</span><div class="ref" ${toEt?'lang="et"':""}>${esc(r.corrected)}</div></div>`));
  el.append(h(`<div><span class="label">Эталон</span><div ${toEt?'lang="et"':""}>${esc(ref)}</div></div>`));
  if(r.offline){
    el.append(h(`<div class="note">Это сравнение с эталоном. Твой вариант может быть правильным, даже если он отличается.</div>`));
    const src = toEt ? sentCur.ru : sentCur.et;
    el.append(claudeLink("Разобрать в Claude", `Я учу эстонский до уровня ${S.level}, мой родной язык русский. Проверь мой перевод с ${toEt?L().gen+" на эстонский":"эстонского на "+L().acc}.
Исходное предложение: «${src}»
Мой перевод: «${sentAnswer.trim()}»
Эталон: «${ref}»
Засчитай любой правильный вариант с тем же смыслом. Коротко объясни ошибки по-русски (падежи, спряжение, порядок слов, лексика) и дай исправленный вариант.`));
  }
  box.append(el);
}
async function checkSentence(panel){
  const ans = sentAnswer.trim();
  if(!ans){ toast("Сначала напишите перевод"); return; }
  const toEt = S.sdir==="ru2et";
  const ref = toEt ? sentCur.et : sentCur.ru;
  const src = toEt ? sentCur.ru : sentCur.et;
  if(!sample){
    const a = normalize(ans), b = normalize(ref);
    const aw = new Set(a.split(" ")), bw = b.split(" ");
    const hit = bw.filter(w=>aw.has(w)).length / bw.length;
    sentResult = {offline:true, score:Math.round(hit*100), verdict: a===b?"correct": hit>=.7?"almost":"wrong"};
    drawSentResult(panel); return;
  }
  sentBusy = true; sentResult = {busy:true}; drawSentResult(panel);
  sentCtl = new AbortController();
  const prompt = `Ты преподаватель эстонского языка, ученик-русскоязычный готовится к уровню B2.
Задание: перевести с ${toEt?L().gen+" на эстонский":"эстонского на "+L().acc}.
Исходное предложение: "${src}"
Эталонный перевод: "${ref}"
Ответ ученика: "${ans}"
Оцени ответ ученика. Принимай любой грамматически правильный перевод с тем же смыслом, даже если он отличается от эталона. Мелкие опечатки и пропущенные знаки над буквами (õ ä ö ü) — "almost". Объясни ошибки кратко по-русски (падежи, спряжение, порядок слов, лексика), максимум 3 предложения.
Верни verdict (correct/almost/wrong), score от 0 до 100, feedback и corrected — исправленный вариант ответа ученика на ${toEt?"эстонском":L().prep} (если ошибок нет, повтори ответ ученика).`;
  try{
    const r = await sample.json(prompt, {schema:SCHEMA_GRADE, signal:sentCtl.signal});
    sentResult = {verdict:["correct","almost","wrong"].includes(r?.verdict)?r.verdict:"almost", score:Number.isFinite(+r?.score)?Math.round(+r.score):null, feedback:String(r?.feedback||""), corrected:String(r?.corrected||"")};
  }catch(e){
    const m = sampleErr(e);
    sentResult = null; sentBusy = false;
    if(m) toast(m);
  }
  sentBusy = false; drawSentResult(panel);
}
async function generateSentence(btn){
  if(!sample) return;
  const seen = [...seenWords()];
  const pool = seen.length>=3 ? seen : allWords().map(w=>w.et);
  const picks = shuffle(pool.slice()).slice(0,3);
  btn.disabled = true; btn.textContent = "Claude пишет…";
  try{
    const r = await sample.json(`Составь одно естественное предложение на эстонском языке уровня ${levelRange()} (${S.level==="A2"?"4–8":"8–16"} слов), используя слова: ${picks.join(", ")} (в любой нужной грамматической форме; можно использовать 2 из 3, если иначе выходит неестественно). Предложение должно быть грамматически безупречным, на повседневную или общественную тему. Дай точный перевод на ${L().acc} (поле ru).
В поле words перечисли использованные слова из списка в начальной форме.`, {schema:SCHEMA_GEN});
    if(r?.et && r?.ru){
      sentCur = {et:String(r.et), ru:String(r.ru), lvl:S.level, words:Array.isArray(r.words)&&r.words.length?r.words.map(String):picks, gen:true};
      sentAnswer=""; sentResult=null;
    }
  }catch(e){ const m=sampleErr(e); if(m) toast(m); }
  renderSent();
}

let chat = null, chatLevel = "all", chatCtl = null;
function newChat(){
  const pool = CHATS.filter(c=>fitsLevel(c.lvl) && (chatLevel==="all" || c.lvl===chatLevel));
  let c = pool[Math.floor(Math.random()*pool.length)];
  if(chat && c===chat.sc && pool.length>1) c = pool[(pool.indexOf(c)+1) % pool.length];
  chatCtl?.abort();
  chat = {sc:c, turns:[{who:"them", et:c.et, ru:isEn()?c.en:c.ru}], draft:"", showSamples:false, busy:false, done:false};
}
function chatTranscript(){
  return chat.turns.map(t=>t.who==="them" ? `${chat.sc.who}: ${t.et}` : `Ученик: ${t.text}`).join("\n");
}
function renderChat(){
  const v = $("#v-chat"); v.innerHTML = "";
  if(!chat) newChat();
  const c = chat.sc;
  v.append(h(`<div><h2>Чат</h2><p class="sub">Вам пишут по-эстонски. Ответьте так, как ответили бы в жизни. Нажмите на сообщение, чтобы увидеть перевод.</p></div>`));
  const chips = h(`<div class="chips" role="group" aria-label="Уровень"></div>`);
  for(const [id,name] of [["all","Все"],["A1","A1"],["A2","A2"],["B1","B1"],["B2","B2"]].filter(([id])=>id==="all" || fitsLevel(id))){
    const n = CHATS.filter(x=>fitsLevel(x.lvl) && (id==="all" || x.lvl===id)).length;
    const b = h(`<button class="chip" aria-pressed="${chatLevel===id}">${name} <small>${n}</small></button>`);
    b.onclick = ()=>{ chatLevel = id; newChat(); renderChat(); };
    chips.append(b);
  }
  v.append(chips);

  const panel = h(`<div class="panel">
    <div class="spread"><div class="who"><div class="avatar">${esc(c.who[0])}</div><div><b>${esc(c.who)}</b><div class="note">${esc(c.role)} · ${esc(c.lvl)}</div></div></div>
      <button class="icon-btn" aria-label="Произнести последнее сообщение">${SPEAK_ICON}</button></div>
    <div class="thread"></div></div>`);
  $(".icon-btn",panel).onclick = ()=>{ const last = [...chat.turns].reverse().find(t=>t.who==="them"); if(last) speak(last.et); };
  const thread = $(".thread",panel);
  const titles = {correct:"Хорошо сказано", almost:"Почти", wrong:"Есть ошибки"};
  for(const t of chat.turns){
    if(t.who==="them"){
      const b = h(`<button class="bubble them"><span lang="et">${esc(t.et)}</span><span class="tr" ${t.showRu?"":"hidden"}>${esc(t.ru)}</span></button>`);
      b.onclick = ()=>{ t.showRu = !t.showRu; $(".tr",b).hidden = !t.showRu; };
      thread.append(b);
    } else {
      thread.append(h(`<div class="bubble me" lang="et">${esc(t.text)}</div>`));
      if(t.review){
        const r = t.review;
        const el = h(`<div class="verdict ${r.verdict}"><div class="head">${titles[r.verdict]||"Разбор"}</div></div>`);
        if(r.feedback) el.append(h(`<div>${esc(r.feedback)}</div>`));
        if(r.corrected && normalize(r.corrected)!==normalize(t.text)) el.append(h(`<div><span class="label">Лучше сказать</span><div class="ref" lang="et">${esc(r.corrected)}</div></div>`));
        thread.append(el);
      }
    }
  }
  if(chat.busy) thread.append(h(`<div class="bubble them typing" aria-label="Собеседник печатает"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`));
  v.append(panel);

  const answered = chat.turns.some(t=>t.who==="me");
  const offlineDone = !sample && answered;
  if(!chat.done && !offlineDone && !chat.busy){
    const comp = h(`<div class="panel">
      <div class="note">Что ответить: ${esc(c.hint)}</div>
      <label class="label" for="chat-answer">Ваш ответ на эстонском</label>
      <textarea id="chat-answer" lang="et" autocapitalize="sentences" placeholder="Kirjuta siia…"></textarea>
      <div class="row"><button class="btn primary" style="flex:1">Отправить</button><button class="btn ghost">Подсказка</button></div></div>`);
    const ta = $("textarea",comp); ta.value = chat.draft; ta.oninput = ()=>{ chat.draft = ta.value; };
    const [send, tip] = comp.querySelectorAll("button");
    send.onclick = ()=>sendChat();
    tip.onclick = ()=>{ chat.showSamples = !chat.showSamples; renderChat(); };
    v.append(comp);
  }
  if((chat.showSamples || offlineDone) && chat.turns.filter(t=>t.who==="them").length===1){
    const sm = h(`<div class="panel"><div class="label">Примеры хороших ответов</div><div class="samples">${c.samples.map(([et,ru,en])=>`<div><div lang="et">${esc(et)}</div><div class="ru">${esc(isEn()?en:ru)}</div></div>`).join("")}</div></div>`);
    v.append(sm);
  }
  if(offlineDone){
    const mine = chat.turns.find(t=>t.who==="me").text;
    v.append(claudeLink("Продолжить разговор в Claude", `Давай потренируем разговорный эстонский, мой родной язык русский, цель — уровень ${S.level}.
Ты — ${c.who} (${c.role}). Ты написал(а) мне: «${c.et}»
Я ответил: «${mine}»
Сначала коротко по-русски оцени мой ответ и исправь ошибки (падежи, спряжение, порядок слов). Потом продолжи разговор в роли одной короткой репликой на эстонском (уровень ${c.lvl}–${S.level}) и дай её перевод на ${L().acc} в скобках. Делай так после каждого моего ответа, пока разговор не закончится естественно (3–4 обмена).`));
    v.append(h(`<p class="note">Claude проверит ответ и продолжит разговор в роли собеседника. Это входит в подписку Claude. С ключом API в настройках разговор шёл бы прямо здесь.</p>`));
  }
  if(chat.done) v.append(h(`<div class="done"><div class="big">Tubli!</div><div>Разговор окончен.</div></div>`));
  const next = h(`<button class="btn ${chat.done||offlineDone?"primary":""}">Новый диалог</button>`);
  next.onclick = ()=>{ newChat(); renderChat(); window.scrollTo(0,0); };
  v.append(next);
}
async function sendChat(){
  const text = chat.draft.trim();
  if(!text){ toast("Сначала напишите ответ"); return; }
  const me = {who:"me", text};
  chat.turns.push(me); chat.draft = ""; chat.showSamples = false;
  if(!sample){ renderChat(); return; }
  const c = chat.sc, myChat = chat;
  chat.busy = true; renderChat();
  chatCtl = new AbortController();
  const exchanges = chat.turns.filter(t=>t.who==="me").length;
  const prompt = `Ты — ${c.who} (${c.role}) и переписываешься по-эстонски с русскоязычным учеником, который готовится к уровню ${S.level}.
Ситуация начинается с твоей реплики: «${c.et}».
Переписка до сих пор:
${chatTranscript()}

1) Оцени последний ответ ученика как реплику в этом разговоре: verdict (correct — естественно и без ошибок, almost — понятно, но с мелкими ошибками, wrong — серьёзные ошибки или не по смыслу). feedback — 1–2 предложения по-русски: что не так (падежи, спряжение, порядок слов, лексика) или короткая похвала. corrected — естественный исправленный вариант его ответа на эстонском.
2) Продолжи разговор в роли одной короткой естественной репликой на эстонском уровня ${c.lvl}–${S.level} (reply_et) и дай её перевод на ${L().acc} (reply_ru).
Это обмен номер ${exchanges}. Если разговор естественно закончился или это уже 4-й обмен, поставь done = true и сделай reply_et прощальной репликой.`;
  try{
    const r = await sample.json(prompt, {schema:SCHEMA_CHAT, signal:chatCtl.signal});
    if(chat !== myChat) return;
    me.review = {verdict:["correct","almost","wrong"].includes(r?.verdict)?r.verdict:"almost", feedback:String(r?.feedback||""), corrected:String(r?.corrected||"")};
    if(r?.reply_et) chat.turns.push({who:"them", et:String(r.reply_et), ru:String(r.reply_ru||"")});
    chat.done = !!r?.done;
  }catch(e){
    if(chat !== myChat) return;
    const m = sampleErr(e); if(m) toast(m);
    chat.turns.pop(); chat.draft = text;
  }
  chat.busy = false;
  if(S.tab==="chat") renderChat();
}

let dq = "", dEntry = null, dBusy = false, dCtl = null;
function renderDict(){
  const v = $("#v-dict"); v.innerHTML = "";
  v.append(h(`<div><h2>Словарь</h2><p class="sub">Эстонский ↔ ${L().acc}. Ищите в словаре приложения или спросите Claude о любом слове: перевод, формы и примеры${sample?". Слова, которые вы уже спрашивали, доступны и без интернета":""}.</p></div>`));

// Match from the start of any word, so "cat" finds "cat" but not "vacation".
const matchesWord = (text, q) => { const t = normalize(text); return t.startsWith(q) || t.split(/[ ,;()/]+/).some(part=>part.startsWith(q)) || t.includes(" "+q); };
function drawLocal(results){
  results.innerHTML = "";
  const q = normalize(dq);
  if(dEntry || dBusy) results.append(entryView());
  if(!q){
    if(!dEntry && !dBusy) results.append(h(`<p class="note">Наберите слово на любом из двух языков. ${sample?"Нажмите «Найти» на клавиатуре, чтобы получить подробную статью от Claude.":"Если слова нет во встроенном словаре, кнопка «Спросить в Claude» откроет Claude с готовым запросом: перевод, формы и примеры."}</p>`));
    return;
  }
  const cached = Object.entries(S.dictCache).filter(([k])=>k.startsWith("en:")===isEn()).map(([,w])=>w).filter(w=>normalize(w.et).includes(q) || normalize(w.ru).includes(q)).map(w=>({et:w.et, ru:w.ru, forms:(w.forms||[]).slice(0,2).map(f=>f.value).join(" · ")}));
  const seenEt = new Set();
  const hits = [...everyWord(), ...cached].filter(w=>!seenEt.has(w.et) && seenEt.add(w.et)).filter(w=>[w.et, w.ru, w.ruText, w.enText].some(x=>x && matchesWord(x, q))).slice(0,30);
  if(sample){
    const ask = h(`<button class="btn primary">Спросить Claude: «${esc(dq.trim())}»</button>`);
    ask.onclick = ()=>askClaude(dq.trim(), results);
    results.append(ask);
  } else results.append(claudeLink(`Спросить в Claude: «${dq.trim()}»`, dictPrompt(dq.trim())));
  if(hits.length){
    const list = h(`<div class="list"></div>`);
    for(const w of hits){
      const it = h(`<div class="item"><div><div class="et" lang="et">${esc(w.et)}</div><div class="ru">${esc(w.ru)}${w.forms?` · <span lang="et">${esc(w.forms)}</span>`:""}</div></div><button class="icon-btn" aria-label="Произнести ${esc(w.et)}">${SPEAK_ICON}</button></div>`);
      $("button",it).onclick=()=>speak(w.et);
      list.append(it);
    }
    results.append(h(`<div class="label">В словаре приложения</div>`), list);
  } else if(!sample){
    results.append(h(`<p class="note">В словаре приложения такого слова нет.</p>`));
  }
}
function entryView(){
  if(dBusy) return h(`<div class="panel"><div class="thinking"><span class="dot"></span>Claude ищет слово…</div></div>`);
  const e = dEntry;
  const p = h(`<div class="panel entry">
    <div class="spread"><div style="min-width:0"><h3 lang="et">${esc(e.et)}</h3><div class="pos">${esc(e.pos||"")}${e.level?` · ${esc(e.level)}`:""}</div></div><button class="icon-btn" aria-label="Произнести">${SPEAK_ICON}</button></div>
    <div class="trans">${esc(e.ru)}</div>
    ${e.forms?.length?`<dl class="formsgrid">${e.forms.map(f=>`<dt>${esc(f.label)}</dt><dd lang="et">${esc(f.value)}</dd>`).join("")}</dl>`:""}
    ${(e.examples||[]).map(x=>`<div class="ex"><div lang="et">${esc(x.et)}</div><div class="ru">${esc(x.ru)}</div></div>`).join("")}
    ${e.note?`<div class="note">${esc(e.note)}</div>`:""}
    <div class="row"></div></div>`);
  $(".icon-btn",p).onclick=()=>speak(e.et);
  const exists = everyWord().some(w=>w.et===e.et);
  const add = h(`<button class="btn sm ${exists?"ghost":"primary"}">${exists?"Уже в карточках":"Добавить в карточки"}</button>`);
  add.disabled = exists;
  add.onclick = ()=>{
    S.custom.push({et:e.et, [isEn()?"en":"ru"]:e.ru, lvl:e.level||"B2", forms:(e.forms||[]).slice(0,2).map(f=>f.value).join(" · "), example:e.examples?.[0]?.et||""});
    persist(); toast("Добавлено в «Мои слова»"); updateStat(); drawLocal(p.parentElement);
  };
  $(".row",p).append(add);
  return p;
}
async function askClaude(q, results){
  const key = (isEn()?"en:":"") + normalize(q);
  if(S.dictCache[key]){ dEntry = S.dictCache[key]; dBusy = false; drawLocal(results); return; }
  if(!sample){ window.open(claudeUrl(dictPrompt(q)), "_blank", "noopener"); return; }
  dCtl?.abort(); dCtl = new AbortController();
  dBusy = true; dEntry = null; drawLocal(results);
  try{
    const r = await sample.json(`Ты эстонско-${isEn()?"английский":"русский"} словарь для русскоязычного ученика (цель ${S.level}). Запрос: "${q}".
Определи язык запроса (эстонский, русский или английский). Дай основное эстонское слово в начальной форме и перевод на ${L().acc} (1–4 значения через запятую). Если запрос — фраза или форма слова, дай начальную форму и объясни форму в note.
Для существительных и прилагательных forms: ["родительный (omastav)", "частичный (osastav)", "мн. ч. частичный"]. Для глаголов: ["ma-инфинитив","da-инфинитив","наст. вр. (ma)","прош. вр. (ma)","страдат. (tud)"]. Для неизменяемых слов forms: [].
Дай 2 коротких естественных примера уровня B1–B2.
Поля: et — слово, ru — перевод на ${L().acc}, pos — часть речи по-русски, level — A1/A2/B1/B2/C1, forms, examples, note — короткое пояснение или пустая строка.`,
      {schema:SCHEMA_DICT, signal:dCtl.signal});
    if(r?.et){ dEntry = {et:String(r.et), ru:String(r.ru||""), pos:r.pos, level:r.level, forms:Array.isArray(r.forms)?r.forms.filter(f=>f&&f.value):[], examples:Array.isArray(r.examples)?r.examples.filter(x=>x&&x.et):[], note:r.note};
      S.dictCache[key] = dEntry; persist(); }
  }catch(e){ const m=sampleErr(e); if(m) toast(m); }
  dBusy = false; drawLocal(results);
}

    <div id="key-status">${keyStatus}</div>
    <ol class="steps note">
      <li>Откройте <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> и войдите.</li>
      <li>Пополните баланс в разделе Billing (хватит нескольких долларов на месяцы занятий).</li>
      <li>Создайте ключ в API Keys, скопируйте и вставьте сюда.</li>
    </ol>
  </div>`);
  const keyIn = $("#api-key",claude); keyIn.value = S.apiKey;
  $("#model",claude).onchange = e=>{ S.model = e.target.value; persist(); setupClaude(); };
  $("#show-key",claude).onclick = e=>{ const show = keyIn.type==="password"; keyIn.type = show?"text":"password"; e.target.textContent = show?"Скрыть ключ":"Показать ключ"; };
  const del = $("#del-key",claude);
  if(del) del.onclick = ()=>{ S.apiKey=""; persist(); setupClaude(); keyStatus=""; renderSettings(); toast("Ключ удалён"); };
  $("#save-key",claude).onclick = async (e)=>{
    S.apiKey = keyIn.value.trim(); persist(); setupClaude();
    if(!S.apiKey){ keyStatus=""; renderSettings(); return; }
    e.target.disabled = true; $("#key-status",claude).innerHTML = `<div class="thinking"><span class="dot"></span>Проверяю ключ…</div>`;
    try{
      const r = await sample.json('Переведи слово "tere" на русский. Поле ru — перевод.', {schema:obj({ru:STR}), maxTokens:2000});
      keyStatus = `<span class="ok">Работает. tere — ${esc(r.ru)}</span>`;
    }catch(err){ keyStatus = `<span class="err">${esc(sampleErr(err) || "Проверка прервана")}</span>`; }
    renderSettings();
  };
  v.append(claude);

  const inst = h(`<div class="panel"><div class="label">Установка на телефон</div></div>`);
  if(standalone()) inst.append(h(`<div class="ok">Приложение установлено.</div>`));
  else {
    if(installEvt){ const b = h(`<button class="btn primary">Установить приложение</button>`); b.onclick = async ()=>{ installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; renderSettings(); }; inst.append(b); }
    inst.append(h(`<div class="note"><b>iPhone (Safari):</b> кнопка «Поделиться» → «На экран „Домой“».<br><b>Android (Chrome):</b> меню ⋮ → «Установить приложение» или «Добавить на главный экран».</div>`));
  }
  v.append(inst);

  const data = h(`<div class="panel"><div class="label">Прогресс</div>
    <div class="note">Сохраните копию, чтобы перенести прогресс на другой телефон или не потерять его при очистке браузера.</div>
    <div class="row"><button class="btn sm ghost" id="exp">Сохранить копию</button><label class="btn sm ghost" for="imp">Загрузить копию</label><input id="imp" type="file" accept="application/json,.json" hidden></div>
    <div class="row"><button class="btn sm bad" id="reset">Сбросить прогресс</button></div></div>`);
  $("#exp",data).onclick = ()=>{
    const blob = new Blob([JSON.stringify({progress:S.progress, custom:S.custom, log:S.log, dictCache:S.dictCache}, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `rukkilill-${today()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  };
  $("#imp",data).onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{ const d = JSON.parse(await f.text());
      if(typeof d.progress!=="object") throw 0;
      Object.assign(S, {progress:d.progress||{}, custom:d.custom||[], log:d.log||{}, dictCache:d.dictCache||{}}); persist(); queue=[]; cur=null; toast("Прогресс загружен"); render();
    }catch(err){ toast("Это не файл копии Rukkilill"); }
  };
  const reset = $("#reset",data);
  reset.onclick = ()=>{
    if(reset.dataset.armed){ S.progress={}; S.log={}; persist(); queue=[]; cur=null; toast("Прогресс сброшен"); render(); return; }
    reset.dataset.armed = "1"; reset.textContent = "Точно сбросить? Нажмите ещё раз";
    setTimeout(()=>{ if(reset.isConnected){ delete reset.dataset.armed; reset.textContent="Сбросить прогресс"; } }, 4000);
  };
  v.append(data);
}

function backBtn(){

  b.onclick = ()=>{ S.more=""; persist(); renderMore(); window.scrollTo(0,0); };
  return b;
}
function renderMore(){
  if(S.more==="settings") return renderSettings();
  if(S.more==="sounds") return renderSounds();
  if(S.more==="estonia") return renderEstonia();
  const v = $("#v-more"); v.innerHTML = "";
  v.append(h(`<div><h2>Ещё</h2></div>`));
  const items = [
    ["sounds","Звуки и буквы","Алфавит с озвучкой, õ ä ö ü, долгота, дифтонги"],
    ["estonia","Об Эстонии","Уезды, крупные города, праздники и викторина"],
    ["settings","Настройки","Уровень, язык перевода, озвучка, ключ API, прогресс"]
  ];
  const list = h(`<div class="list"></div>`);
  for(const [id,name,note] of items){

    it.onclick = ()=>{ S.more=id; persist(); renderMore(); window.scrollTo(0,0); };

  v.append(list);
}

// Letters: [letter, example, translation, how it sounds]
const ALPHABET = [
 ["A a","ema","мама","Как русское «а»."],
 ["B b","buss","автобус","Глухо и слабо, между «б» и «п»."],
 ["D d","kodu","дом (родной)","Глухо и слабо, между «д» и «т»."],

 ["F f","foto","фото","Только в заимствованных словах."],
 ["G g","mägi","гора","Глухо и слабо, между «г» и «к»."],
 ["H h","homme","завтра","Лёгкий выдох, как английское h."],

const LENGTH_PAIRS = [["koli","хлам","kooli","школы"],["sada","сто","saada","отправь"],["lina","лён","linna","города"],["kana","курица","kanna","неси"]];
const DIPHTHONGS = [["ai","lai","широкий"],["ei","leib","хлеб"],["oi","poiss","мальчик"],["ui","kui","когда; если"],["äi","päike","солнце"],["õi","õige","правильный"],["au","laud","стол"],["õu","õun","яблоко"]];
let soundSel = null;
function renderSounds(){
  const v = $("#v-more"); v.innerHTML = "";
  v.append(backBtn());
  v.append(h(`<div><h2>Звуки и буквы</h2><p class="sub">Нажмите на букву или слово, чтобы услышать. Эстонское слово читается так, как пишется, а ударение почти всегда на первом слоге.</p></div>`));

  const sel = soundSel ? ALPHABET.find(a=>a[0]===soundSel) : null;
  const detail = h(`<div class="panel letter-detail">${sel
    ? `<div class="spread"><div class="big-letter">${esc(sel[0])}</div><button class="btn sm ghost">${SPEAK_ICON} ${esc(sel[1])}</button></div><div><b lang="et">${esc(sel[1])}</b> — ${esc(sel[2])}</div><div>${esc(sel[3])}</div>`
    : `<div class="note">Выберите букву, чтобы увидеть, как она звучит.</div>`}</div>`);
  if(sel) $("button",detail).onclick = ()=>speak(sel[1]);
  v.append(h(`<div class="label">Алфавит</div>`), detail);
  const grid = h(`<div class="letters"></div>`);
  for(const a of ALPHABET){
    const b = h(`<button class="letter ${soundSel===a[0]?"on":""} ${/[ÕÄÖÜ]/.test(a[0])?"special":""}"><span class="l">${esc(a[0])}</span><span class="w" lang="et">${esc(a[1])}</span></button>`);
    b.onclick = ()=>{ soundSel = a[0]; speak(a[1]); renderSounds(); };
    grid.append(b);
  }
  v.append(grid);
  v.append(h(`<p class="note">Буквы c, q, w, x, y, z, ž встречаются только в иностранных словах и именах.</p>`));

  const len = h(`<div class="panel"><div class="label">Короткий и долгий звук</div>
    <div>Двойная буква означает долгий звук. От долготы меняется смысл слова, поэтому тяните двойные буквы заметно дольше.</div><div class="pairs"></div></div>`);
  for(const [a,at,b,bt] of LENGTH_PAIRS){
    const row = h(`<div class="pair"><button class="btn sm ghost">${SPEAK_ICON} <span lang="et">${a}</span></button><span class="note">${at}</span><button class="btn sm ghost">${SPEAK_ICON} <span lang="et">${b}</span></button><span class="note">${bt}</span></div>`);
    const [x,y] = row.querySelectorAll("button"); x.onclick=()=>speak(a); y.onclick=()=>speak(b);
    $(".pairs",len).append(row);
  }
  v.append(len);

  const q3 = h(`<div class="panel"><div class="label">Третья долгота: kooli и kooli</div>
    <div>В эстонском есть третья, сверхдолгая степень. На письме её не видно: <b lang="et">kooli</b> «школы» (род. п.) и <b lang="et">kooli</b> «в школу» пишутся одинаково. Во втором случае «оо» тянется ещё дольше, а голос к концу слога понижается. Различить их помогает контекст.</div>
    <div class="pairs"></div><div class="note">Синтезатор выбирает долготу по смыслу предложения. Слушайте разницу в целых фразах.</div></div>`);
  for(const [et,ru] of [["See on kooli maja.","Это здание школы."],["Ma lähen kooli.","Я иду в школу."],["Linna keskus on ilus.","Центр города красивый."],["Ma sõidan linna.","Я еду в город."]]){
    const row = h(`<div class="pair wide"><button class="btn sm ghost">${SPEAK_ICON} <span lang="et">${et}</span></button><span class="note">${ru}</span></div>`);
    $("button",row).onclick = ()=>speak(et);
    $(".pairs",q3).append(row);
  }
  v.append(q3);

  const di = h(`<div class="panel"><div class="label">Дифтонги</div><div>Две гласные в одном слоге произносятся слитно, без паузы и без «й» между ними.</div><div class="pairs"></div></div>`);
  for(const [d,w,t] of DIPHTHONGS){
    const row = h(`<div class="pair"><b class="dg">${d}</b><button class="btn sm ghost">${SPEAK_ICON} <span lang="et">${w}</span></button><span class="note">${t}</span></div>`);
    $("button",row).onclick = ()=>speak(w);
    $(".pairs",di).append(row);
  }
  v.append(di);
}

 ["Jõgevamaa","Йыгевамаа","Jõgeva","Йыгева"],["Järvamaa","Ярвамаа","Paide","Пайде"],["Läänemaa","Ляэнемаа","Haapsalu","Хаапсалу"],
 ["Lääne-Virumaa","Ляэне-Вирумаа","Rakvere","Раквере"],["Põlvamaa","Пылвамаа","Põlva","Пылва"],["Pärnumaa","Пярнумаа","Pärnu","Пярну"],
 ["Raplamaa","Рапламаа","Rapla","Рапла"],["Saaremaa","Сааремаа","Kuressaare","Курессааре"],["Tartumaa","Тартумаа","Tartu","Тарту"],
 ["Valgamaa","Валгамаа","Valga","Валга"],["Viljandimaa","Вильяндимаа","Viljandi","Вильянди"],["Võrumaa","Вырумаа","Võru","Выру"]

const CITIES = [["Tallinn","Таллин","≈ 450 тыс."],["Tartu","Тарту","≈ 97 тыс."],["Narva","Нарва","≈ 53 тыс."],["Pärnu","Пярну","≈ 40 тыс."],

let quiz = null;
function newQuiz(){
  const q = COUNTIES[Math.floor(Math.random()*COUNTIES.length)];
  const opts = shuffle([q, ...shuffle(COUNTIES.filter(c=>c!==q)).slice(0,3)]);
  quiz = {q, opts, picked:null, score:quiz?.score||0, total:quiz?.total||0};
}
function renderEstonia(){
  const v = $("#v-more"); v.innerHTML = "";
  v.append(backBtn());
  v.append(h(`<div><h2>Об Эстонии</h2><p class="sub">Нажмите на эстонское название, чтобы услышать, как оно звучит.</p></div>`));
  const sayBtn = (et) => { const b = h(`<button class="say" lang="et">${esc(et)}</button>`); b.onclick = ()=>speak(et); return b; };

  const facts = h(`<div class="list"></div>`);
  for(const [et,ru,val] of FACTS){
    const it = h(`<div class="item"><div><div class="ru">${esc(ru)}</div><div class="et"></div></div><div class="val">${esc(val)}</div></div>`);
    $(".et",it).append(sayBtn(et));
    facts.append(it);
  }
  v.append(h(`<div class="label">Коротко</div>`), facts);

  if(!quiz) newQuiz();
  const qz = h(`<div class="panel"><div class="spread"><div class="label">Викторина: центр уезда</div><span class="note">${quiz.score} из ${quiz.total}</span></div>
    <div>Какой город — центр уезда <b lang="et">${esc(quiz.q[0])}</b> (${esc(quiz.q[1])})?</div><div class="actions quiz"></div><div class="qres"></div></div>`);
  for(const o of quiz.opts){
    const cls = quiz.picked ? (o===quiz.q ? "good" : (o===quiz.picked ? "bad" : "")) : "";
    const b = h(`<button class="btn ${cls}" lang="et">${esc(o[2])}</button>`);
    b.disabled = !!quiz.picked;
    b.onclick = ()=>{ quiz.picked = o; quiz.total++; if(o===quiz.q) quiz.score++; speak(quiz.q[2]); renderEstonia(); };
    $(".quiz",qz).append(b);
  }
  if(quiz.picked){
    $(".qres",qz).append(h(`<div>${quiz.picked===quiz.q?"Верно!":"Не совсем."} Центр уезда ${esc(quiz.q[0])} — <b lang="et">${esc(quiz.q[2])}</b> (${esc(quiz.q[3])}).</div>`));
    const n = h(`<button class="btn primary">Следующий вопрос</button>`); n.onclick = ()=>{ newQuiz(); renderEstonia(); };
    $(".qres",qz).append(n);
  }
  v.append(qz);

  const ct = h(`<div><div class="label" style="margin-bottom:8px">15 уездов (maakonnad) и их центры</div><div class="list"></div></div>`);
  for(const [et,ru,c,cru] of COUNTIES){
    const it = h(`<div class="item"><div><div class="et"></div><div class="ru">${esc(ru)}</div></div><div class="val"><span class="c"></span><div class="ru">${esc(cru)}</div></div></div>`);
    $(".et",it).append(sayBtn(et)); $(".c",it).append(sayBtn(c));
    $(".list",ct).append(it);
  }
  v.append(ct);
  v.append(h(`<div class="panel"><div class="label">Как сказать по-эстонски</div>
    <div>Где? <b lang="et">Ma elan Tartumaal.</b> Я живу в Тартумаа.</div>
    <div>Куда? <b lang="et">Ma sõidan Saaremaale.</b> Я еду на Сааремаа.</div>
    <div>Откуда? <b lang="et">Ma olen pärit Läänemaalt.</b> Я родом из Ляэнемаа.</div>
    <div class="note">У названий на -maa окончания всегда такие: -maal, -maale, -maalt.</div></div>`));

  const cities = h(`<div><div class="label" style="margin-bottom:8px">Крупнейшие города</div><div class="list"></div><p class="note">Численность населения примерная, округлена.</p></div>`);
  for(const [et,ru,n] of CITIES){
    const it = h(`<div class="item"><div><div class="et"></div><div class="ru">${esc(ru)}</div></div><div class="val">${esc(n)}</div></div>`);
    $(".et",it).append(sayBtn(et));
    $(".list",cities).append(it);
  }
  v.append(cities);
}

if("serviceWorker" in navigator){
  // When an update takes over, reload once so the new version shows right away.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(hadController && !reloading){ reloading = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); });
  }).catch(()=>{});
}
render();
</script>
